name: Untis Kalender Sync

on:
  schedule:
    - cron: '0 5 * * *' # Läuft täglich um 06:00 Uhr deutscher Zeit
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install git+https://github.com छंद/python-webuntis.git ics

      - name: Skript ausführen
        env:
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
        run: python untis_sync.py

      - name: Kalenderdatei auf GitHub aktualisieren
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stundenplan.ics
          git commit -m "Update Stundenplan" || exit 0
          git push
